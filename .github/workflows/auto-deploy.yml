name: 自动部署到 GitHub Pages
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [master]

jobs:
  # 第一阶段：Docusaurus 构建 + GitHub Pages 部署
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 提升到 job 级 env：step 的 if 无法引用 secrets 上下文
      GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
    steps:
      - name: 检出完整代码+Git标签
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 依赖缓存：setup-node 自带 pnpm store 缓存（与 lockfile 绑定）
      - name: 配置Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装指定版本 PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 构建缓存：复用 Docusaurus faster / rspack 持久化缓存（.docusaurus）
      # 这是 CI 提速的关键 —— 不再每次都冷构建
      - name: 缓存 Docusaurus 构建缓存（faster/rspack 持久化缓存）
        uses: actions/cache@v4
        with:
          path: .docusaurus
          key: ${{ runner.os }}-docusaurus-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-

      - name: 静态构建（注入Supabase环境变量供前端页面调用）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          rm -rf build
          pnpm build

      - name: 校验构建产物
        run: ls -la build/

      - name: 推送静态文件至GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  # 第二阶段：部署成功后自动解析Git Tag/提交，写入更新日志
  auto_changelog:
    needs: deploy # 强制等待页面部署完全成功才执行
    runs-on: ubuntu-latest
    env:
      SUPA_URL: ${{ secrets.SUPABASE_URL }}
      SUPA_API_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: 重新拉取完整代码与标签
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 赋予脚本可执行权限
        run: chmod +x ./get-commit-desc.sh

      - name: 运行脚本解析版本、标题、类型、描述
        run: ./get-commit-desc.sh

      # 可选：AI 自然语言摘要（配置 GH_MODELS_TOKEN 后自动启用）
      # 免费渠道：GitHub Models（需一个带 models:read 权限的 PAT，无需信用卡/新账号）
      - name: AI 自然语言摘要（可选，需 GH_MODELS_TOKEN）
        if: ${{ env.GH_MODELS_TOKEN != '' }}
        continue-on-error: true
        run: |
          RAW="changelog_raw.txt"
          if [ ! -f "$RAW" ]; then
            echo "[调试] 未找到原始材料，跳过 AI 摘要"
            exit 0
          fi

          # 提取提交记录与文件改动，拼接为用户消息
          USER_CONTENT=$({
            echo "---- 提交记录 ----"
            sed -n '/===COMMIT_LOG===/,/===END===/p' "$RAW" | sed '1d;$d'
            echo ""
            echo "---- 文件改动（路径列表）----"
            sed -n '/===DIFF_STAT===/,/===END===/p' "$RAW" | sed '1d;$d'
          })

          SYS_INSTR='你是一个发布说明撰写助手。根据下面的 Git 提交记录与文件改动统计，用简体中文写一段 2-4 句话的更新摘要，面向普通用户，口语化、积极，不要列出 commit 哈希或代码细节。'

          # 用 jq 安全构造 OpenAI 兼容请求体（自动转义）
          jq -n --arg sys "$SYS_INSTR" --arg usr "$USER_CONTENT" '{
            model: "gpt-4o-mini",
            messages: [
              { role: "system", content: $sys },
              { role: "user",   content: $usr }
            ],
            temperature: 0.3,
            max_tokens: 300
          }' > body.json

          RESP=$(curl -s -m 30 "https://models.inference.ai.azure.com/chat/completions" \
            -H "Authorization: Bearer $GH_MODELS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @body.json)

          SUMMARY=$(echo "$RESP" | jq -r '.choices[0].message.content // empty')

          if [ -n "$SUMMARY" ]; then
            # 转义为可写入 GITHUB_ENV 与 JSON 的单行文本
            ESC=$(printf '%s' "$SUMMARY" | sed 's/\\/\\\\/g; s/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
            echo "DESC=$ESC" >> "$GITHUB_ENV"
            echo "[调试] AI 摘要已生成，覆盖规则摘要"
          else
            echo "[调试] AI 摘要为空，沿用规则摘要"
            echo "$RESP" | head -c 500
          fi

      - name: 写入日志到Supabase（接口失败不影响部署状态）
        continue-on-error: true
        run: |
          curl -X POST "${SUPA_URL}/rest/v1/update_logs" \
          -H "apikey: ${SUPA_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '[
            {
              "version": "${{ env.VERSION }}",
              "title": "${{ env.TITLE }}",
              "type": "${{ env.TYPE }}",
              "description": "${{ env.DESC }}",
              "release_date": "'$(date +%Y-%m-%d)'"
            }
          ]'
